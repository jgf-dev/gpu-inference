name: ci

on:
  push:
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync --frozen
      - run: uv run pyright contracts/ dist/
      - run: uv run pytest
      - run: python3 scripts/regen_guard.py verify
      - run: python3 scripts/regen_guard.py stale
      - run: docker build -f deploy/Dockerfile -t comfyui-spec:ci .
