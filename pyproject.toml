[project]
name = "comfyui-spec-first"
version = "0.1.0"
description = "Spec-first ComfyUI deployment for Modal and Beam"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = [
    "hypothesis>=6.131,<7",
    "pytest>=8.3,<9",
    "pyright>=1.1.400,<2",
    "ruff>=0.9,<1",
    "modal>=1.6.3",
    "beam-client>=0.2.239",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["contracts", "dist"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py313"
